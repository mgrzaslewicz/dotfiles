TMUX_COLORTAG_USE_POWERLINE=yes
TMUX_COLORTAG_TAG_ONLY=yes

# rebind control key
unbind C-b
set -g prefix C-a

set-option -g history-limit 20000

# count windows from 1
set -g base-index 1

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

set -g default-terminal "screen-256color"
#set -g default-terminal "tmux-256color"


# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'

# Style
# neovim tokyonight-night colors
bg="#222436"
bg_dark="#16161e"
bg_dark1="#0C0E14"
bg_highlight="#2f334d"
blue="#82aaff"
blue0="#3e68d7"
blue1="#65bcff"
blue2="#0db9d7"
blue5="#89ddff"
blue6="#b4f9f8"
blue7="#394b70"
comment="#636da6"
cyan="#86e1fc"
dark3="#545c7e"
dark5="#737aa2"
fg="#c8d3f5"
fg_dark="#828bb8"
fg_gutter="#3b4261"
green="#c3e88d"
green1="#4fd6be"
green2="#41a6b5"
magenta="#c099ff"
magenta2="#ff007c"
orange="#ff966c"
purple="#fca7ea"
red="#ff757f"
red1="#c53b53"
teal="#4fd6be"
terminal_black="#444a73"
yellow="#ffc777"

set -g status-position top
set -g status-style "fg=${fg_dark},bg=default"
set -g status-left-length 100
set -g status-left "#[fg=${fg_dark}]#[bg=${bg_highlight}] #S "
set -g status-right "#{cpu} 󰍛#{mem} #{tmux_mode_indicator} %H:%M %d/%m"
set -g @mode_indicator_empty_prompt ' N '
set -g @mode_indicator_empty_mode_style "bg=${bg_dark},fg=${fg_dark}"
set -g @mode_indicator_prefix_prompt ' P '
set -g @mode_indicator_prefix_mode_style "bg=${blue0},fg=${fg}"
set -g @mode_indicator_copy_prompt ' V '
set -g @mode_indicator_coyp_mode_style "bg=${yellow},fg=${dark5}"
set -g @mode_indicator_sync_prompt ' S '
# inactive/active window styles
# to print shell colours: for i in {0..255} ; do printf "\x1b[38;5;${i}mcolour${i}\n"; done
set -g window-style 'fg=colour247,bg=colour234'
set -g window-active-style 'fg=colour250,bg=colour232'

set -g window-status-current-format "#[fg=${fg_dark},bold] #[underscore]#I:#W"
set -g window-status-format " #I:#W"


# set the pane border colors
set -g pane-border-style 'fg=colour235,bg=colour238'
set -g pane-active-border-style 'fg=colour51,bg=colour236'

bind 'v' copy-mode
setw -g mode-keys vi

# Better copy-mode-vi bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Auto renumber windows when one is closed
set -g renumber-windows on

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -as terminal-features ",gnome*:RGB"

# Increase display time for messages
set -g display-time 2000

# Faster command sequences (removes pause after escape)
set -s escape-time 0

#bind u send-keys C-l \; run-shell "sleep .3s" \; clear-history
bind-key -n C-k send-keys C-l \; send-keys -R \; clear-history
bind-key -n M-Enter send-keys \;\ spd-say\ $? Enter

# switch panes using Alt-arrow without prefix; forwarded to Neovim when it is the active pane,
# where vim-tmux-navigator moves between splits and hands back to tmux at the edge
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n M-Left if-shell "$is_vim" 'send-keys M-Left' 'select-pane -L'
bind -n M-Right if-shell "$is_vim" 'send-keys M-Right' 'select-pane -R'
bind -n M-Up if-shell "$is_vim" 'send-keys M-Up' 'select-pane -U'
bind -n M-Down if-shell "$is_vim" 'send-keys M-Down' 'select-pane -D'

# copy to system clipboard on select
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "xclip -selection clipboard -i" \; send -X clear-selection

# Configuration management.

    # Reload configuration file.
    bind R source-file ~/.tmux.conf |; display "Sourced ~/.tmux.conf"

    # Split panes using | and -
    bind | split-window -h -c "#{pane_current_path}"
    bind - split-window -v -c "#{pane_current_path}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
