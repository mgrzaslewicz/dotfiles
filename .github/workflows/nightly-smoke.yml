# Smoke suite of the Neovim config, nightly and outside the PR gate: the replayed LSP-behavior tests
# (dot_config/nvim/tests/test_replay_*.lua) against the real jdtls and kotlin-lsp at their Mason pins. Red while the
# contracts are green means the servers or the protocol drifted from the recordings: re-record with
# `mise run test:record` and review the diff. See dot_config/nvim/docs/adr/0001-replay-recorded-lsp-responses-in-unit-tests.md.
name: nightly smoke

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Only the tools the smoke suite needs, at the repo's mise.toml pins.
      - uses: jdx/mise-action@v2
        with:
          install_args: neovim java gradle maven tree-sitter
      - run: mise run test:smoke
