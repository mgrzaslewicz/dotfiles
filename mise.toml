[tools]
chezmoi = "latest"
tmux = "latest"
# Neovim config: pinned so tests (dot_config/nvim/tests) and daily use run the same versions
neovim = "0.12.6"
stylua = "2.6.0"
lua-language-server = "3.19.2"
# End-to-end tests only (mise run test:e2e): JDK for jdtls/kotlin-lsp/debug adapters, builds of the fixture projects,
# parser builds. The host has its own; `:checkhealth custom` lists what the config needs there.
java = "temurin-25.0.5+8.0.LTS"
gradle = "9.8.2"
maven = "3.9.16"
tree-sitter = "0.27.1"

[tasks.test]
description = "Neovim config tests (dot_config/nvim/tests); pass a test file to run only that one"
run = "dot_config/nvim/tests/run.sh"

[tasks."test:e2e"]
description = "End-to-end tests with real servers, builds and DAP (dot_config/nvim/tests/e2e); on demand, see the nvim-config skill"
run = "dot_config/nvim/tests/run.sh --e2e"

[tasks."check:format"]
description = "stylua formatting check for dot_config/nvim"
dir = "dot_config/nvim"
run = "stylua --check ."

[tasks."check:types"]
description = "lua-language-server diagnostics for dot_config/nvim (plugin types from tests/.tests, run tests once first)"
dir = "dot_config/nvim"
# lua-language-server ignores SIGINT until the check is done; Ctrl-C is forwarded as SIGTERM.
run = '''
VIMRUNTIME=$(nvim --clean --headless +'lua io.write(vim.env.VIMRUNTIME)' +qa) \
  lua-language-server --check=. --checklevel=Warning --logpath=tests/.tests/lua-language-server &
pid=$!
trap 'kill -TERM "$pid" 2>/dev/null; exit 130' INT TERM
wait "$pid"
'''

[tasks.check]
description = "Everything a commit to dot_config/nvim must pass: format, tests, types"
run = ["mise run check:format", "mise run test", "mise run check:types"]

[tasks."nvim:update"]
description = "Bump Neovim plugins and Mason pins to latest, check (e2e if a Mason pin moved), commit on this branch; no push"
run = 'NVIM_PACKAGES_REPO="$MISE_PROJECT_ROOT" dot_local/bin/executable_nvim-packages update'

[tasks."nvim:sync"]
description = "Make this host match the dotfiles: chezmoi apply ~/.config/nvim, then plugin lockfile revisions and Mason pins"
run = "dot_local/bin/executable_nvim-packages sync"

[tasks.setup]
description = "Use the repo's git hooks (.githooks); repo-local config, shared by all worktrees"
run = "git config core.hooksPath .githooks"
